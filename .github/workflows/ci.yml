# Validação de todo pull request (e da `main`, que grava os caches): lint, gates, tipos, unidade e `cargo check` nos três sistemas.
# Mesmas actions (e mesmos SHAs) de release.yml; sem secrets, sem escrita.
name: CI

on:
  pull_request:
    # PR só de documentação não compila nada.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE*"
  # Cache de PR só serve ao próprio PR; o da `main` é o único que todo PR novo enxerga. Sem este
  # gatilho nenhum cache de Rust era salvo na `main`, e todo PR compilava as dependências do zero.
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE*"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Na `main` o run é quem grava o cache: cancelá-lo a cada merge deixava a `main` sem cache nenhum.
  # Lá os runs entram em fila (o pendente mais novo substitui o anterior, o em andamento termina).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: true
  # Sem debuginfo em dev/test: compila e linka mais rápido e o cache do Rust fica menor.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  # Só a `main` grava cache de Rust: o rust-cache guarda as dependências, iguais entre PRs, e cada
  # PR gravando o seu (GBs por job) estourava os 10 GB do repositório e expulsava o da `main`.
  SAVE_RUST_CACHE: ${{ github.ref == 'refs/heads/main' }}
  # .deb do apt: uma entrada só, gravada pelo E2E Linux da `main` (o superconjunto), lida pelos outros jobs.
  APT_DEB_CACHE: /home/runner/.cache/apt-debs
  # Dependências nativas do Tauri no Linux (webkit, tray, áudio, captura, X11) — igual a release.yml.
  LINUX_DEPS: >-
    libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libasound2-dev
    libxss-dev libxdo-dev libxkbcommon-dev libxcb1-dev libxrandr-dev libdbus-1-dev
    libpipewire-0.3-dev libgbm-dev libegl-dev libwayland-dev libclang-dev

jobs:
  # Só TypeScript, sem Rust nem libs do sistema: roda em paralelo com `verify` (que leva o `cargo test`).
  js:
    name: Lint, tipos e unidade
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -s lint

      - run: pnpm -s typecheck

      - run: pnpm -s test:unit

  verify:
    name: Build e gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # A imagem do runner troca o rustc no meio do rollout (1.99.1 e 1.100.0 no mesmo dia): o hash do
      # rust-cache muda junto, o job compila tudo do zero e as duas variantes disputam os 10 GB de cache.
      - name: Rust stable atualizado
        run: rustup update stable --no-self-update && rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-verify
          cache-on-failure: true
          save-if: ${{ env.SAVE_RUST_CACHE }}

      # Chave pela imagem do runner: .deb de outra imagem pode depender de versão que ela não tem.
      - name: Chave do cache do apt
        if: runner.os == 'Linux'
        id: apt
        run: |
          echo "key=apt-debs-$ImageOS-$ImageVersion-${{ hashFiles('.github/workflows/ci.yml') }}" >> "$GITHUB_OUTPUT"
          echo "prefix=apt-debs-$ImageOS-" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: runner.os == 'Linux'
        id: apt-cache
        with:
          path: ${{ env.APT_DEB_CACHE }}
          key: ${{ steps.apt.outputs.key }}
          # Imagem nova do runner (o rollout convive dias com a anterior) ou ci.yml alterado: sem
          # fallback era download do zero nos mirrors (17,9 min no run 44675103775). O apt confere cada
          # .deb do cache contra o índice assinado e baixa só o que mudou de versão.
          restore-keys: ${{ steps.apt.outputs.prefix }}

      - name: Dependências do sistema (Linux)
        run: ./.github/scripts/apt-install.sh $LINUX_DEPS

      - run: pnpm install --frozen-lockfile

      # `pnpm gates` termina em `cargo test --lib`: o `tauri-build` exige `out/prompts` e `out/renderer`.
      - name: Build do renderer e dos prompts
        run: pnpm --filter @mika/desktop build

      - run: pnpm -s gates

  rust:
    name: cargo check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # A imagem do runner troca o rustc no meio do rollout (1.99.1 e 1.100.0 no mesmo dia): o hash do
      # rust-cache muda junto, o job compila tudo do zero e as duas variantes disputam os 10 GB de cache.
      - name: Rust stable atualizado
        run: rustup update stable --no-self-update && rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-check-${{ matrix.os }}
          cache-on-failure: true
          save-if: ${{ env.SAVE_RUST_CACHE }}

      # Chave pela imagem do runner: .deb de outra imagem pode depender de versão que ela não tem.
      - name: Chave do cache do apt
        if: runner.os == 'Linux'
        id: apt
        run: |
          echo "key=apt-debs-$ImageOS-$ImageVersion-${{ hashFiles('.github/workflows/ci.yml') }}" >> "$GITHUB_OUTPUT"
          echo "prefix=apt-debs-$ImageOS-" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: runner.os == 'Linux'
        id: apt-cache
        with:
          path: ${{ env.APT_DEB_CACHE }}
          key: ${{ steps.apt.outputs.key }}
          # Imagem nova do runner (o rollout convive dias com a anterior) ou ci.yml alterado: sem
          # fallback era download do zero nos mirrors (17,9 min no run 44675103775). O apt confere cada
          # .deb do cache contra o índice assinado e baixa só o que mudou de versão.
          restore-keys: ${{ steps.apt.outputs.prefix }}

      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: ./.github/scripts/apt-install.sh $LINUX_DEPS

      - run: pnpm install --frozen-lockfile

      - name: Build do renderer e dos prompts
        run: pnpm --filter @mika/desktop build

      - name: cargo check --lib
        run: cargo check --lib --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

      # Código atrás de `--features steam` (`src/steam.rs`) só compila aqui; sem este passo ele ficava
      # sem checagem até o job `steam` do release, tarde demais para um PR.
      - name: cargo check --lib --features steam
        run: cargo check --lib --locked --features steam --manifest-path apps/desktop/src-tauri/Cargo.toml

  # E2E fora do Windows: não há CDP em WebKitGTK/WKWebView, então o binário `--features e2e` serve o
  # bundle e o IPC em loopback (`src-tauri/src/e2e_host.rs`) e o Playwright dirige um Chromium nessas
  # páginas (`apps/desktop/e2e/fixtures/e2e-host.ts`). O backend Rust é o real.
  e2e:
    name: E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # A imagem do runner troca o rustc no meio do rollout (1.99.1 e 1.100.0 no mesmo dia): o hash do
      # rust-cache muda junto, o job compila tudo do zero e as duas variantes disputam os 10 GB de cache.
      - name: Rust stable atualizado
        run: rustup update stable --no-self-update && rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-e2e-${{ matrix.os }}
          cache-on-failure: true
          save-if: ${{ env.SAVE_RUST_CACHE }}

      # Chave pela imagem do runner: .deb de outra imagem pode depender de versão que ela não tem.
      - name: Chave do cache do apt
        if: runner.os == 'Linux'
        id: apt
        run: |
          echo "key=apt-debs-$ImageOS-$ImageVersion-${{ hashFiles('.github/workflows/ci.yml') }}" >> "$GITHUB_OUTPUT"
          echo "prefix=apt-debs-$ImageOS-" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: runner.os == 'Linux'
        id: apt-cache
        with:
          path: ${{ env.APT_DEB_CACHE }}
          key: ${{ steps.apt.outputs.key }}
          # Imagem nova do runner (o rollout convive dias com a anterior) ou ci.yml alterado: sem
          # fallback era download do zero nos mirrors (17,9 min no run 44675103775). O apt confere cada
          # .deb do cache contra o índice assinado e baixa só o que mudou de versão.
          restore-keys: ${{ steps.apt.outputs.prefix }}

      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: ./.github/scripts/apt-install.sh $LINUX_DEPS xvfb dbus-x11

      - run: pnpm install --frozen-lockfile

      - name: Versão do Playwright
        id: pw
        run: echo "version=$(pnpm --filter @mika/desktop exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # O download do Chromium (~150 MB) só muda com a versão do Playwright.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pw-cache
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Chromium do Playwright
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @mika/desktop exec playwright install chromium

      # Libs de sistema do Chromium não vão no cache; no macOS não há o que instalar.
      - name: Dependências do Chromium (Linux)
        if: runner.os == 'Linux'
        run: pnpm --filter @mika/desktop exec playwright install-deps chromium

      - name: Guardar os .deb baixados (Linux)
        if: runner.os == 'Linux' && steps.apt-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        run: ./.github/scripts/apt-snapshot.sh

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: runner.os == 'Linux' && steps.apt-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        with:
          path: ${{ env.APT_DEB_CACHE }}
          key: ${{ steps.apt.outputs.key }}

      - name: Build do binário E2E
        run: pnpm --filter @mika/desktop build:e2e

      # Só os `@smoke`: a suíte inteira tem specs antigas (wizard de 4 etapas, prompts em PT) que
      # falham em qualquer sistema e ainda esperam reescrita — ver `apps/desktop/e2e/README.md`.
      - name: Specs @smoke (Linux, display virtual)
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- pnpm --filter @mika/desktop exec playwright test -c e2e/playwright.config.ts --grep @smoke

      - name: Specs @smoke (macOS)
        if: runner.os == 'macOS'
        run: pnpm --filter @mika/desktop exec playwright test -c e2e/playwright.config.ts --grep @smoke

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-screenshots-${{ matrix.os }}
          path: apps/desktop/e2e/screenshots/
          if-no-files-found: ignore
