<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mika cursor</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  svg { position: absolute; left: 0; top: 0; width: 28px; height: 28px; filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.45)); }
  .ring { position: absolute; left: 0; top: 0; width: 20px; height: 20px; border-radius: 50%; transform-origin: 0 0;
    border: 2px solid #ff6fb5; opacity: 0; }
  body.click .ring { animation: ripple 0.6s ease-out; }
  @keyframes ripple { from { transform: scale(0.4); opacity: 1; } to { transform: scale(1.9); opacity: 0; } }
</style>
</head>
<body>
  <div class="ring"></div>
  <svg viewBox="0 0 28 28" aria-hidden="true">
    <path d="M2 2 L2 22 L8 16.5 L12 25 L15.5 23.5 L11.5 15 L19.5 15 Z" fill="#ff6fb5" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round"/>
  </svg>
</body>
</html>
